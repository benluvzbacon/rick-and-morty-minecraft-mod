name: Build & Smoke Test

on:
  push:
    branches: [ "arena/01a0beb4-rick-and-morty-minecraft-mod" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Probe maven metadata (diagnostics)
        if: always()
        run: |
          mkdir -p dist
          {
            echo "=== fabric-loom plugin marker ==="
            curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | grep -o "<version>[^<]*" | sed 's/<version>//' | tr '\n' ' '
            echo; echo "=== yarn latest 1.21.1 ==="
            curl -s https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -o "1.21.1+build.[0-9]*" | tr '\n' ' '
            echo; echo "=== loader latest ==="
            curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -o "<version>0.1[0-9][^<]*" | sed 's/<version>//' | tr '\n' ' '
            echo; echo "=== fabric-api 1.21.1 ==="
            curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "[0-9.]*+1.21.1" | tr '\n' ' '
            echo
          } > dist/maven_probe.txt 2>&1

      - name: Build with Gradle
        id: gradle
        run: |
          ./gradlew build --no-daemon --stacktrace > build_console.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Prepare run dir
        if: always()
        run: mkdir -p run && echo "eula=true" > run/eula.txt

      - name: Run dedicated server smoke test (self test stops the server)
        if: always() && steps.gradle.outputs.exit == '0'
        run: timeout 420 ./gradlew runServer --no-daemon > run_server_console.log 2>&1 || true

      - name: Collect results
        if: always()
        run: |
          mkdir -p dist
          rm -f dist/rick-and-morty-mod-*.jar
          cp build/libs/rick-and-morty-mod-*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar
          ls -la build/libs/ > dist/build_libs_listing.txt 2>&1 || true
          {
            echo "GRADLE_EXIT=${{ steps.gradle.outputs.exit }}"
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) build finished"
          } > dist/BUILD_INFO.txt
          {
            echo "===== BUILD LOG (errors & tail) ====="
            grep -n -i "error:\|FAILED\|Cannot\|Exception" build_console.log | head -80
            echo "-----"
            tail -n 60 build_console.log
          } > dist/build_report.txt 2>&1 || true
          {
            echo "===== SELF TEST RESULTS ====="
            grep -h "RICKMORTY-SELFTEST" run/logs/latest.log run_server_console.log 2>/dev/null
            echo ""
            echo "===== SERVER LOG (tail) ====="
            tail -n 200 run/logs/latest.log 2>/dev/null || tail -n 200 run_server_console.log 2>/dev/null
          } > dist/selftest.txt 2>&1 || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rickmorty-build
          path: |
            dist/
            run/logs/latest.log
            build_console.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit results back to branch
        if: always()
        run: |
          git config user.name "rickmorty-ci[bot]"
          git config user.email "rickmorty-ci[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "CI: build & smoke test results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a0beb4-rick-and-morty-minecraft-mod

      - name: Fail job if build failed
        if: steps.gradle.outputs.exit != '0'
        run: exit 1
