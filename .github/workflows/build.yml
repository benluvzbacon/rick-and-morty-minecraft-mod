name: Build & Smoke Test

on:
  push:
    branches: [ "arena/01a0beb4-rick-and-morty-minecraft-mod" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Prepare run dir
        run: mkdir -p run && echo "eula=true" > run/eula.txt

      - name: Run dedicated server smoke test (self test stops the server)
        run: timeout 420 ./gradlew runServer --no-daemon > run_server_console.log 2>&1 || true

      - name: Collect results
        run: |
          mkdir -p dist
          rm -f dist/rick-and-morty-mod-*.jar
          cp build/libs/rick-and-morty-mod-*.jar dist/ 2>/dev/null || true
          rm -f dist/*-sources.jar
          ls -la build/libs/ > dist/build_libs_listing.txt 2>&1 || true
          echo "===== SELF TEST RESULTS =====" > dist/selftest.txt
          grep -h "RICKMORTY-SELFTEST" run/logs/latest.log run_server_console.log 2>/dev/null >> dist/selftest.txt || true
          echo "" >> dist/selftest.txt
          echo "===== SERVER LOG (tail) =====" >> dist/selftest.txt
          tail -n 250 run/logs/latest.log 2>/dev/null >> dist/selftest.txt || tail -n 250 run_server_console.log >> dist/selftest.txt || true
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) build finished" > dist/BUILD_INFO.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rickmorty-build
          path: |
            dist/
            run/logs/latest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit results back to branch
        run: |
          git config user.name "rickmorty-ci[bot]"
          git config user.email "rickmorty-ci[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "CI: build & smoke test results [skip ci]" || echo "nothing to commit"
          git push origin HEAD:arena/01a0beb4-rick-and-morty-minecraft-mod
